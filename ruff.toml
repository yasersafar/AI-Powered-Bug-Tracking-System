# Shared Ruff configuration for all Python code (backend/ and ml/).
target-version = "py311"
line-length = 100
extend-exclude = ["backend/alembic/versions"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "S",        # bandit (security)
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
]
ignore = [
    "B008",     # FastAPI uses Depends(...) in argument defaults by design
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107"]  # assert + hard-coded test passwords are fine in tests

[lint.isort]
known-first-party = ["app", "ml"]

[format]
quote-style = "double"
