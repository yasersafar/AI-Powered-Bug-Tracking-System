# Local services for development and the demo.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the database data)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TODO(#7): add the self-hosted ntfy container here once the notification choice is final.

volumes:
  pgdata:
