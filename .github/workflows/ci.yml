# Runs on every PR and on pushes to main: lint + backend tests with coverage (NFR-13).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint
        run: ruff check .

      - name: Test
        # Once the backend has real tests, add --cov-fail-under=70 to enforce NFR-13.
        run: |
          if [ -d tests ]; then
            pytest --cov=. --cov-report=term
          else
            echo "No tests yet"
          fi
