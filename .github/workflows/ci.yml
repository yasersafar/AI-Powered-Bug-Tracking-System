# Continuous integration: runs on every pull request and on pushes to main.
# Backend: Ruff (lint + format), mypy (strict), pytest with coverage >= 70 % (NFR-13).
# Extension: ESLint, TypeScript type check, Prettier, esbuild bundle.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: bugtracker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bugtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugtracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bugtracker:ci-only-password@localhost:5432/bugtracker
      TEST_DATABASE_URL: postgresql+psycopg://bugtracker:ci-only-password@localhost:5432/bugtracker_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-used-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/requirements.txt

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
          python -m pip install --upgrade pip
          # The backend runs the triage models in-process (CPU-only PyTorch).
          pip install "torch~=2.15" --index-url https://download.pytorch.org/whl/cpu
          pip install -r ../ml/requirements.txt -e ".[dev]"

      - name: Ruff lint
        run: ruff check . ../ml

      - name: Ruff format check
        run: ruff format --check . ../ml

      - name: mypy
        run: mypy

      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  ml:
    name: ML unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install (CPU-only PyTorch wheels)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ml/requirements-train.txt
          pip install pytest mypy ruff

      - name: mypy (strict)
        run: mypy --config-file ml/pyproject.toml -p ml

      - name: Unit tests
        working-directory: ml
        run: pytest

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Extension tests run inside a downloaded VS Code; a virtual display is needed on Linux.
      - name: Tests (@vscode/test-electron)
        run: xvfb-run -a npm test

      - name: Package .vsix
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: ai-bug-tracker-vsix
          path: extension/*.vsix

  compose:
    name: docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: |
          python3 backend/scripts/init_env.py
          docker compose config --quiet
