[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bugtracker-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-Powered Bug Tracking System (Capstone II)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.165",
    "uvicorn[standard]~=0.54",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "email-validator~=2.4",
    "sqlalchemy~=2.1",
    "alembic~=1.20",
    "psycopg[binary]~=3.3",
    "bcrypt~=5.0",
    "pyjwt~=2.15",
    "python-multipart~=0.0.34",
    "python-magic~=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "pytest-cov~=7.1",
    "httpx2~=2.16",  # used by Starlette's TestClient
    "ruff~=0.17",
    "mypy~=2.4",
    "openapi-spec-validator~=0.9",  # validates docs/openapi.json (NFR-13, DC-05)
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not perf'"
markers = [
    "live: needs the docker-compose services (make up); run with `make test-live`",
    "perf: real models and load (NFR-01..03); run with `make test-perf`",
]
# The repository root is added so the backend can import the `ml` package.
pythonpath = [".", ".."]

# ---------------------------------------------------------------- coverage (NFR-13)
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ".:.."  # `ml` (the triage models) lives next to `backend`
packages = ["app", "scripts"]

[[tool.mypy.overrides]]
# Third-party ML libraries without type information
module = [
    "sklearn.*", "joblib.*", "sentence_transformers.*", "scipy.*", "rank_bm25.*", "pandas.*",
    "matplotlib.*", "pyarrow.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
